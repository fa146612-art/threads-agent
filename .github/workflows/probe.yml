name: probe-search

# 키워드 검색과 남의 글 답글이 실제로 되는지 확인하는 일회성 워크플로.
# 결과는 probe_result.json 에 커밋된다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 읽기만, 0이면 남의 글에 실제로 답글을 단다"
        required: false
        default: "1"
      delete_id:
        description: "삭제를 시험할 게시물 id (비우면 건너뜀)"
        required: false
        default: ""
  push:
    paths:
      - "bot/probe_search.py"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Probe
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '1' }}
          DELETE_ID: ${{ github.event.inputs.delete_id || '18073817216403078' }}
        run: python bot/probe_search.py
      - name: Commit result
        run: |
          git config user.name  "threads-agent"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "probe 결과 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
