name: peek

# 남의 계정을 공식 API로 읽을 수 있는지 확인한다. 결과는 peek_result.json.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "볼 사람의 핸들"
        required: false
        default: "juvin950"
  push:
    paths:
      - "bot/peek.py"
      - ".github/workflows/peek.yml"

permissions:
  contents: write

jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Peek
        env:
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TARGET: ${{ github.event.inputs.target || 'juvin950' }}
        run: python bot/peek.py
      - name: Commit result
        run: |
          git config user.name  "threads-agent"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "peek 결과 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
