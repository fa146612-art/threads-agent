name: ig-probe

on:
  workflow_dispatch: {}
  push:
    paths:
      - "bot/instagram_api.py"
      - "bot/ig_probe.py"
      - ".github/workflows/ig_probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Probe Instagram
        env:
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
        run: python bot/ig_probe.py
      - name: Commit result
        run: |
          git config user.name  "threads-agent"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "ig probe 결과 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
