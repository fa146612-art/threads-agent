name: threads-agent

on:
  schedule:
    # every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:
    # only when the code changes - the agent's own state commits must not
    # retrigger the workflow, or it would loop forever
    paths:
      - "bot/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: threads-agent
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run one agent cycle
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python bot/run.py

      - name: Commit any changes
        run: |
          git config user.name  "threads-agent"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "agent cycle $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
