name: threads-agent

# 2026-07-30 전면 중단 (오수원님 지시).
# 자동 실행(cron)과 push 트리거를 모두 제거했다. 손으로 실행할 때만 돈다.
# 재개하려면 아래 schedule/push 블록을 다시 살리고 루트의 PAUSED 파일을 지운다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: threads-agent
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run one agent cycle
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
        run: python bot/run.py

      - name: Commit any changes
        run: |
          git config user.name  "threads-agent"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "agent cycle $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
