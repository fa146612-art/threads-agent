name: build-short

# 쇼츠 영상 빌드. Actions 러너는 외부망이 열려 있어서 edge-tts 를 쓸 수 있다.
# 결과물은 media/short_latest.mp4 로 커밋된다.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "video 또는 voices"
        required: false
        default: "video"
  push:
    paths:
      - "video/**"
      - ".github/workflows/video.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet edge-tts playwright
          playwright install --with-deps chromium

      - name: 목소리 비교본
        if: github.event.inputs.job == 'voices' || github.event_name == 'push'
        run: python video/voicetest.py || echo "목소리 비교 실패(무시)"

      - name: 영상 빌드
        if: github.event.inputs.job != 'voices'
        run: python video/build.py

      - name: 결과 확인
        if: github.event.inputs.job != 'voices'
        run: |
          ls -la media/short_latest.mp4
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_type,width,height -of json media/short_latest.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: media
          path: |
            media/short_latest.mp4
            media/voice_compare.mp3
          if-no-files-found: ignore

      - name: 커밋
        run: |
          git config user.name  "threads-agent"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "쇼츠 영상 빌드 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
