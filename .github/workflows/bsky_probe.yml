name: bsky-probe

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 읽기만, 0이면 실제로 글을 하나 써본다"
        required: false
        default: "1"
  # 2026-07-30 중단: push 트리거 제거 (수동 실행만)

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Probe Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '1' }}
        run: python bot/bsky_probe.py
      - name: Commit result
        run: |
          git config user.name  "threads-agent"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "bsky probe 결과 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
